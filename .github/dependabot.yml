# Dependabot — the two ecosystems the lockfile + the workflow consume.
# The updates are GROUPED per ecosystem (one PR per ecosystem per cycle — the
# solo-reviewer load; the gate, not the PR granularity, is the safety net).
# The advisory-DB snapshot (deps/rustsec-advisory-db) is NOT dependabot-managed:
# it is a pinned contract input — its refresh is the documented maintainer step
# (docs/security.md, the refresh procedure). A Dependabot PR that breaks the
# byte contract fails the required CI check and does not merge.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/tool"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"
